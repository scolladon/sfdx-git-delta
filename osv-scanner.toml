# csv-parse@5.6.0 is a transitive of @salesforce/core via @jsforce/jsforce-node,
# which pulls it in for Bulk API CSV handling. SGD never reaches that path: it
# imports only Logger/LoggerLevel, Messages and SfProject from @salesforce/core,
# never connects to an org, and parses no CSV — so the `columns` option the
# advisory turns on is never called, with user input or otherwise. The fix is a
# major bump (7.0.2) of a package this project does not call, gated on jsforce
# releasing against it; an override here would force a major on a transitive to
# close a path that is not open.
[[IgnoredVulns]]
id = "GHSA-8cw4-87c7-c6xx"
reason = "csv-parse via @salesforce/core/jsforce-node; Bulk API CSV path is never entered by SGD"
