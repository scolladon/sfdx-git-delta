---
name: E2E Tests a published version
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true

jobs:
  e2e-test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node: [22, 24, 26]
        cli: ['@salesforce/cli']
    runs-on: ${{ matrix.os }}
    steps:
      # Runs before any other step so an unusable channel never reaches an
      # install. Explicitly bash: the default shell on the windows legs is
      # pwsh, where POSIX test syntax raises a non-terminating error and the
      # step would exit 0 - the guard would silently pass on 3 of 9 legs.
      - name: Require a resolved channel
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -z "$CHANNEL" ]; then
            echo "::error::channel input is empty - refusing to run e2e against an unspecified build"
            exit 1
          fi
          case "$CHANNEL" in
            *@)
              echo "::error::channel has an empty version spec: $CHANNEL"
              exit 1
              ;;
            *[!A-Za-z0-9@:/._-]*)
              echo "::error::channel contains unexpected characters: $CHANNEL"
              exit 1
              ;;
          esac

      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: 'e2e/head'
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Set environment variables
        run: |
          echo "SF_DISABLE_AUTOUPDATE=true" >> "$GITHUB_ENV"
          echo "SF_DISABLE_TELEMETRY=true" >> "$GITHUB_ENV"

      - name: Install cli
        run: npm install -g ${{ matrix.cli }}

      - name: Install new plugin version
        run: echo y | sf plugins install ${{ inputs.channel }}

      - name: Test new plugin version
        run: sf sgd source delta --help

      - name: E2E Tests
        run: |
          npm install
          npm run test:e2e

      - name: Display diff
        run: git --no-pager diff
