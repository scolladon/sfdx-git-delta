---
name: Performance Benchmarks
on:
  workflow_call:
    inputs:
      auto-push:
        description: Push benchmark data to gh-pages
        type: boolean
        default: false

jobs:
  perf:
    runs-on: ubuntu-latest
    # Perf is informational only: regressions/flakes show up as a PR
    # comment from compareBaseline.mjs but never block the merge.
    continue-on-error: true
    permissions:
      contents: read
    env:
      # Disable husky hooks (notably post-checkout, which runs
      # `npm run dependencies:reinstall`). Without this, every baseline
      # `git checkout` inside this job re-dirties package-lock.json,
      # breaking the benchmark-action step's internal `git switch gh-pages`.
      HUSKY: '0'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Checkout gh-pages baseline data
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: gh-pages
          path: gh-pages-data

      - name: Run baseline benchmarks (base branch)
        if: ${{ !inputs.auto-push }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: |
          CURRENT_REF=$(git rev-parse HEAD)
          git checkout --detach --force "$BASE_REF"
          npm ci --no-fund --prefer-offline
          npm run test:perf
          cp perf-runtime.json perf-runtime-base.json
          cp perf-memory.json perf-memory-base.json
          git checkout --force "$CURRENT_REF"
          npm ci --no-fund --prefer-offline
          # npm ci can touch tracked files (e.g. metadata-only writes to
          # package-lock.json on some npm versions) leaving the WC dirty.
          # Reset every tracked file so the subsequent benchmark-action
          # step's internal `git switch gh-pages` isn't blocked by a
          # "Your local changes would be overwritten" error.
          git checkout -- .

      - name: Run benchmarks
        run: npm run test:perf

      - name: Compare against baseline (same runner)
        if: ${{ !inputs.auto-push }}
        run: node __tests__/perf/compareBaseline.mjs

      - name: Generate preview with trends
        run: node __tests__/perf/preview.mjs gh-pages-data

      - name: Reset WC before gh-pages switch
        if: ${{ !inputs.auto-push }}
        run: |
          # benchmark-action's internal `git switch gh-pages` fails with
          # "Your local changes would be overwritten" if any tracked file
          # is dirty. Clean the WC now so the switch succeeds; perf
          # artifacts (perf-runtime.json, perf-memory.json) are gitignored
          # and survive `git clean -fd` via the whitelist below.
          # benchmark-action now runs in perf-publish, a separate job whose
          # checkout is definitionally clean, so this step is retained only
          # until the first post-split run confirms it is unnecessary.
          git status --short
          git checkout -- .
          git clean -fd -e perf-runtime.json -e perf-memory.json -e perf-runtime-base.json -e perf-memory-base.json -e perf-comparison.md -e perf-preview.html -e gh-pages-data

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: |
            perf-preview.html
            perf-runtime.json
            perf-memory.json
            perf-comparison.md

  # Separate job on purpose: it holds the only write scope this workflow
  # needs on a pull request, checks out nothing and runs no repository
  # code. always() is required, not decorative — continue-on-error: true on
  # `perf` makes needs.perf.result report success even when the job failed,
  # so the implicit success() gate a plain `needs:` gets would be a gate
  # that cannot fail. != 'skipped' is what still distinguishes "did not
  # run" from "ran and was masked".
  perf-comment:
    needs: [perf]
    if: |
      always() &&
      !inputs.auto-push &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.perf.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Neither an empty scope nor a failure before compareBaseline.mjs
      # writes (checkout, setup-node, npm ci, a bench crash) leaves a
      # perf-report artifact behind — download-artifact hard-errors on a
      # missing artifact, so this step must not be allowed to fail the job
      # on top: the job's only remaining failure mode must stay "the
      # comment genuinely did not post".
      - name: Download benchmark report
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: perf-report

      - name: Comment perf comparison
        if: hashFiles('perf-comparison.md') != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: perf-comparison.md
          comment-tag: same-runner-perf
          mode: recreate

      - name: Comment missing perf comparison
        if: hashFiles('perf-comparison.md') == ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            The performance run produced no comparison for this pull request — check the `perf` job log for details.
          comment-tag: same-runner-perf
          mode: recreate

  # Separate job on purpose: it is the only one holding contents: write,
  # and it installs no repository dependencies — benchmark-action is a
  # bundled JavaScript action that does not read the repository's
  # node_modules. Runs only on a main push (auto-push), never on a pull
  # request, and never blocks that push: continue-on-error keeps a
  # gh-pages publish failure from failing the caller.
  perf-publish:
    needs: [perf]
    if: always() && inputs.auto-push
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Unnecessary here (no `npm install` runs, so husky never sets
      # core.hooksPath), but free, and the failure it prevents is
      # expensive.
      HUSKY: '0'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Download benchmark report
        uses: actions/download-artifact@v7
        with:
          name: perf-report

      - name: Runtime benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Runtime Benchmark
          tool: customBiggerIsBetter
          output-file-path: ./perf-runtime.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ inputs.auto-push }}
          save-data-file: ${{ inputs.auto-push }}
          alert-threshold: '130%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: ${{ inputs.auto-push }}
          alert-comment-cc-users: '@scolladon'
          benchmark-data-dir-path: dev/bench/runtime

      - name: Latency benchmark
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Latency Benchmark
          tool: customSmallerIsBetter
          output-file-path: ./perf-memory.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ inputs.auto-push }}
          save-data-file: ${{ inputs.auto-push }}
          skip-fetch-gh-pages: true
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false
          summary-always: ${{ inputs.auto-push }}
          alert-comment-cc-users: '@scolladon'
          benchmark-data-dir-path: dev/bench/memory
