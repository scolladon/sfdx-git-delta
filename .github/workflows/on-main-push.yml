---
name: Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "img/**"

# Least-privilege default; jobs that need more escalate explicitly.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit

  prepare-release:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          release-type: node

  perf:
    needs: [prepare-release]
    if: ${{ needs.prepare-release.outputs.release_created != 'true' }}
    # A ceiling, not a use. reusable-perf.yml's perf-publish job pushes
    # benchmark data to gh-pages, so contents: write is genuinely needed
    # here. pull-requests: write is not used on a main push — perf-comment
    # never runs — but the grant is validated against every job the callee
    # declares, not only the reachable ones, so it has to cover that
    # declaration too. What actually scopes each token is the per-job
    # permissions block in reusable-perf.yml.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/reusable-perf.yml
    with:
      auto-push: true
