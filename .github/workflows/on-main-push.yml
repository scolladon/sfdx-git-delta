---
name: Main

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "img/**"

# Least-privilege default; jobs that need more escalate explicitly.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit

  prepare-release:
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          release-type: node

  perf:
    needs: [prepare-release]
    if: ${{ needs.prepare-release.outputs.release_created != 'true' }}
    # reusable-perf.yml's perf-publish job pushes benchmark data to
    # gh-pages, so this grant needs contents: write; a reusable workflow
    # cannot exceed the caller's grant. It does nothing else here — a main
    # push never runs perf-comment.
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-perf.yml
    secrets: inherit
    with:
      auto-push: true
