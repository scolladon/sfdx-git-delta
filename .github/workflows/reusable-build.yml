---
name: Build Checks
on:
  workflow_call:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Lint plugin
        run: npm run lint

      - name: Build plugin
        run: npm pack

      - name: Unit test
        run: npm run test:unit

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Integration test
        run: npm run test:integration

      - name: Checkout e2e sources
        uses: actions/checkout@v6
        with:
          ref: 'e2e/head'
          fetch-depth: 0
          path: ./e2e

      - name: NUT test
        run: npm run test:nut

      - name: Functional test
        run: npm run test:functional

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-test-report
          path: reports/coverage

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      # No wireit GitHub-Actions caching here: the cache layer's tar
      # archiving fails on windows runners ("tar error" in every task).
      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Integration test
        run: npm run test:integration

      - name: Build plugin
        run: npm pack

      - name: Checkout e2e sources
        uses: actions/checkout@v6
        with:
          ref: 'e2e/head'
          fetch-depth: 0
          path: ./e2e

      - name: Fetch e2e base and head branches
        working-directory: ./e2e
        run: git fetch origin e2e/base:e2e/base e2e/head:e2e/head

      - name: Setup e2e dependencies
        working-directory: ./e2e
        run: npm ci

      - name: E2E byte-equality
        working-directory: ./e2e
        run: npm run clean && npm run test:e2e:local && npm run validate
