---
name: Build Checks
on:
  workflow_call:

jobs:
  # Platform-independent logic gates: run exactly once, on the reference
  # environment (ubuntu + latest node), with wireit GH-Actions caching.
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Lint plugin
        run: npm run lint

      - name: Build plugin
        run: npm pack

      - name: Unit test
        run: npm run test:unit

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-test-report
          path: reports/coverage

  # Platform-dependent buckets: everything that spawns the compiled CLI or
  # touches git/filesystem behavior runs on every supported os × node pair.
  platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Floating: previous LTS, active LTS, current. These shift when a new
        # LTS is cut (Oct), so engines.node must move with them or CI stops
        # testing a version the manifest still promises.
        node: ['lts/-1', 'lts/*', 'latest']
    defaults:
      run:
        shell: bash
    steps:
      # The windows runner's git ships core.autocrlf=true: unset it before
      # checkout so sources keep LF and tools see committed bytes. Harmless
      # on linux/macos where autocrlf is off anyway.
      - name: Keep LF line endings
        run: git config --global core.autocrlf input

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No wireit GitHub-Actions caching in this job: the cache layer's tar
      # archiving fails on windows runners ("tar error" in every task).
      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      # Build before the integration bucket: the lifecycle test spawns the
      # compiled CLI (bin/run.js -> lib/), which wireit's test:integration
      # does not itself produce.
      - name: Build plugin
        run: npm pack

      - name: Integration test
        run: npm run test:integration

      - name: Checkout e2e sources
        uses: actions/checkout@v7
        with:
          ref: 'e2e/head'
          fetch-depth: 0
          path: ./e2e

      # The checkout above already materialized e2e/head as the current
      # local branch (fetching into it would be refused); only e2e/base
      # needs a local branch for the suite's diff endpoints.
      - name: Fetch e2e base branch
        working-directory: ./e2e
        run: git fetch origin e2e/base:e2e/base

      - name: Setup e2e dependencies
        working-directory: ./e2e
        run: npm ci

      - name: NUT test
        run: npm run test:nut

      - name: Functional test
        run: npm run test:functional

      # The e2e suite's scripts invoke `../bin/run.js` shebang-style, which
      # cmd.exe (npm's default script shell on windows) cannot execute; the
      # e2e branches are immutable fixtures, so route npm scripts through
      # bash instead of editing them.
      - name: E2E byte-equality
        working-directory: ./e2e
        env:
          npm_config_script_shell: bash
        run: npm run clean && npm run test:e2e:local && npm run validate
