---
name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "img/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  pull-requests: write

# Manage concurrency to stop running jobs and start new ones in case of new commit pushed
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        continue-on-error: true

  pull-request-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
  npm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Check outdated dependencies
        run: npm outdated --omit=dev

      - name: Check unused dependencies
        run: npm run lint:dependencies

      - name: Check dependencies node engines
        run: npm run lint:engine

      - name: Audit dependencies
        run: npm audit || true

  megalinter:
    runs-on: ubuntu-latest
    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@v7

      # MegaLinter
      - name: MegaLinter
        # You can override MegaLinter flavor used to have faster performances
        # More info at https://megalinter.io/latest/flavors/
        uses: oxsecurity/megalinter/flavors/javascript@v9
        env:
          # All available variables are described in documentation
          # https://megalinter.io/latest/config-file/
          APPLY_FIXES: all
          VALIDATE_ALL_CODEBASE: true
          # ADD CUSTOM ENV VARIABLES HERE TO OVERRIDE VALUES OF .mega-linter.yml AT THE ROOT OF YOUR REPOSITORY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log

  incremental-mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Incremental Mutation testing
        run: npm run test:mutation:incremental

      - uses: actions/upload-artifact@v7
        with:
          name: mutation-testing-reports
          path: reports/mutation

  build:
    uses: ./.github/workflows/reusable-build.yml
    secrets: inherit

  perf:
    needs: [build]
    uses: ./.github/workflows/reusable-perf.yml
    secrets: inherit

  # Publishes a per-commit preview build and runs the e2e matrix against it.
  #
  # Two out-of-repo settings this depends on. Neither is expressible in a
  # workflow file, and changing either changes a security property:
  #   1. The pkg.pr.new GitHub App must be installed on this repository, or
  #      the preview step fails with a 404.
  #   2. "Fork pull request workflows from outside collaborators" must require
  #      approval for ALL outside collaborators. A fork's build is published
  #      under this project's name, and that setting is the only control on it
  #      - the GitHub default gates first-time contributors only, so a
  #      returning contributor would otherwise publish unattended.
  preview:
    needs: [build]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.publish.outputs.urls }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup dependencies, cache and install
        uses: ./.github/actions/install

      - name: Publish preview
        id: publish
        run: npm run preview:publish

  # Separate job on purpose: a failed comment upsert must not skip the e2e
  # matrix. Both jobs fan out from preview, so e2e depends on the build alone.
  # Skipped for fork pull requests, whose token is read-only.
  comment:
    needs: [preview]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment install command
        uses: actions/github-script@v9
        env:
          CHANNEL: ${{ needs.preview.outputs.channel }}
        with:
          script: |
            const marker = '<!-- sgd-preview -->'
            const body = [
              marker,
              '',
              'Preview build for this commit:',
              '',
              `    sf plugins install ${process.env.CHANNEL}`,
              '',
              'Preview URLs are per-commit and immutable. After each push,',
              'copy the command again rather than re-running an earlier one.',
              '',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            )
            const existing = comments.find(
              c => c.user?.type === 'Bot' && (c.body ?? '').startsWith(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

  e2e-tests:
    needs: [preview]
    permissions:
      contents: read
    uses: ./.github/workflows/run-e2e-tests.yml
    with:
      channel: ${{ needs.preview.outputs.channel }}
