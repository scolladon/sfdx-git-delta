---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(github-actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    commit-message:
      prefix: "feat(metadata)"
    allow:
      - dependency-name: "@salesforce/source-deploy-retrieve"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "manual-review-only"
    allow:
      - dependency-name: "@nodable/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "build(deps)"
    # Entry-level, not merely excluded from the group: the two entries above
    # own these packages. Excluding them from a group would still leave this
    # entry watching them, opening a second ungrouped pull request that
    # dependabot-auto-merge.yml cannot tell apart from the dedicated one.
    ignore:
      - dependency-name: "@salesforce/source-deploy-retrieve"
      - dependency-name: "@nodable/*"
    groups:
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
