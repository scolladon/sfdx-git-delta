---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    groups:
      github-actions:
        patterns:
          - "*"

  # Repository-specific: a metadata registry bump is a feature here, and
  # dependabot-auto-merge.yml diffs the registry, retitles and self-merges it.
  # Entry-level rather than merely excluded from the group below, so the general
  # entry never opens a second, indistinguishable pull request for it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    commit-message:
      prefix: "feat(metadata)"
    allow:
      - dependency-name: "@salesforce/source-deploy-retrieve"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "build"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "@salesforce/source-deploy-retrieve"
    groups:
      npm:
        patterns:
          - "*"
